[package]
name = "discourse_core"
version = "0.1.0"
edition = "2021"

[dependencies]
url = "2.5"
indexmap = "2.0"
chrono = "0.4"
tar = "0.4"
flate2 = "1.0"
zip = "2.0"
thiserror = "2.0"
regex = "1.13.1"
html5gum = "0.9.0"
html-escape = "0.3.0"
scraper = "0.29.0"
nix = { version = "0.31.3", features = ["process", "signal"] }
magnus = "0.9.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
notify = "8.2.1"
lazy_static = "1.5.1"
hostname = "0.4.2"

[dev-dependencies]
tempfile = "3.2"
