[package]
name = "discourse_core"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.27", features = ["signal", "process"] }
walkdir = "2.4"
notify = "6.1"
hostname = "0.3"
scraper = "0.18"
html-escape = "0.2"
html5gum = "0.5"
lazy_static = "1.4"
url = "2.5"
indexmap = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tar = "0.4"
flate2 = "1.0"
zip = "2.0"
thiserror = "2.0"
once_cell = "1.18"

[dev-dependencies]
tempfile = "3.2"

[lib]
crate-type = ["cdylib", "rlib"]
