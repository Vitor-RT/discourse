[package]
name = "discourse_core"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.27", features = ["signal", "process"] }
walkdir = "2.4"
notify = "6.1"
hostname = "0.3"
scraper = "0.18"
html-escape = "0.2"
html5gum = "0.5"
lazy_static = "1.4"
url = "2.5"
indexmap = "2.0"
chrono = "0.4"
tar = "0.4"
flate2 = "1.0"
zip = "2.0"
thiserror = "2.0"
once_cell = "1.18"
roxmltree = "0.21"
ammonia = "3.3"
reqwest = { version = "0.11", features = ["blocking"] }
any_ascii = "0.3"
deadpool-redis = "0.14"
redis = { version = "0.24", features = ["tokio-comp", "aio"] }
tokio = { version = "1.35", features = ["full"] }
serde_yaml = "0.9"
uuid = { version = "1.6", features = ["v4"] }
sha2 = "0.11.1"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.2"

[lib]
crate-type = ["cdylib", "rlib"]
